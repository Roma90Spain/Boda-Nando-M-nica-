<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Aplicación para organizar torneos de pádel. Boda de Nando y Mónica.">
    <meta name="author" content="Álvaro">
    <title>Torneo de Pádel - Boda de Nando y Mónica</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .grid-main {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: #555;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }

        button {
            background: #667eea;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            width: 100%;
            margin-top: 10px;
        }

        button:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        button.danger {
            background: #e74c3c;
        }

        button.danger:hover {
            background: #c0392b;
        }

        button.secondary {
            background: #95a5a6;
        }

        button.secondary:hover {
            background: #7f8c8d;
        }

        button:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
            transform: none;
        }

        .jugador-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            margin-bottom: 8px;
            background: #f8f9fa;
            border-radius: 5px;
            border-left: 4px solid #667eea;
        }

        .genero-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.85em;
        }

        .genero-badge.H {
            background: #3498db;
            color: white;
        }

        .genero-badge.M {
            background: #e91e63;
            color: white;
        }

        .pareja-card {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 12px;
            text-align: center;
        }

        .pareja-card h3 {
            font-size: 1.1em;
            margin-bottom: 8px;
        }

        .pareja-card p {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .partidos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .partido-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .partido-card h4 {
            margin-bottom: 10px;
            font-size: 0.9em;
            opacity: 0.9;
        }

        .vs {
            font-size: 1.8em;
            font-weight: bold;
            margin: 10px 0;
        }

        .password-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .password-modal.active {
            display: flex;
        }

        .password-box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
            min-width: 300px;
        }

        .password-box h3 {
            margin-bottom: 20px;
            color: #333;
        }

        .password-box input {
            margin-bottom: 15px;
        }

        .password-box button {
            margin: 10px 5px;
            display: inline-block;
            width: calc(50% - 7.5px);
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .stat-box {
            background: #f0f4ff;
            padding: 12px;
            border-radius: 5px;
            text-align: center;
        }

        .stat-number {
            font-size: 1.8em;
            color: #667eea;
            font-weight: bold;
        }

        .stat-label {
            font-size: 0.85em;
            color: #666;
            margin-top: 5px;
        }

        .fase {
            margin-top: 20px;
        }

        .fase h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.2em;
        }

        .empty-state {
            text-align: center;
            padding: 30px;
            color: #999;
        }

        @media (max-width: 768px) {
            .grid-main {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 1.8em;
            }

            .partidos-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎾 Torneo de Pádel</h1>
            <p>💍 Boda de Nando y Mónica 💒 🍾 🎊</p>
        </header>

        <div class="grid-main">
            <!-- PANEL IZQUIERDO: Gestión de jugadores y parejas -->
            <div class="card">
                <h2>Jugadores & Parejas</h2>
                
                <div class="form-group">
                    <label>Nombre del jugador</label>
                    <input type="text" id="nombreJugador" placeholder="Ej: Juan" />
                </div>

                <div class="form-group">
                    <label>Género</label>
                    <select id="generoJugador">
                        <option value="">-- Selecciona --</option>
                        <option value="H">👨 Hombre</option>
                        <option value="M">👩 Mujer</option>
                    </select>
                </div>

                <button onclick="agregarJugador()">➕ Agregar Jugador</button>

                <div class="stats">
                    <div class="stat-box">
                        <div class="stat-number" id="countH">0</div>
                        <div class="stat-label">Hombres</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-number" id="countM">0</div>
                        <div class="stat-label">Mujeres</div>
                    </div>
                </div>

                <div id="listaJugadores"></div>

                <button class="secondary" onclick="solicitarPassword('generarParejas')" style="margin-top: 20px;">🔀 Generar Parejas (Aleatorio)</button>

                <button class="danger" onclick="limpiarTodo()">🗑️ Limpiar Todo</button>
            </div>

            <!-- PANEL DERECHO: Emparejamientos y partidos -->
            <div class="card">
                <h2>Emparejamientos</h2>

                <div id="parejas" class="empty-state">
                    Sin parejas todavía. Genera las parejas primero.
                </div>

                <button class="secondary" onclick="solicitarPassword('generarEmparejamientos')" style="margin-top: 20px;">⚔️ Generar Emparejamientos</button>

                <button class="secondary" onclick="mostrarPartidos()" style="margin-top: 10px;">👀 Ver Partidos</button>
            </div>
        </div>

        <!-- SECCIÓN DE PARTIDOS -->
        <div class="card">
            <h2>📋 Partidos del Torneo</h2>

            <div id="contenedorPartidos" class="empty-state">
                Los partidos aparecerán aquí una vez generes los emparejamientos.
            </div>
        </div>
    </div>

    <!-- MODAL DE CONTRASEÑA -->
    <div class="password-modal" id="passwordModal">
        <div class="password-box">
            <h3>🔐 Contraseña</h3>
            <input type="password" id="passwordInput" placeholder="Ingresa la contraseña" onkeypress="if(event.key==='Enter') confirmarPassword()" />
            <div>
                <button onclick="confirmarPassword()">✓ Aceptar</button>
                <button class="danger" onclick="cancelarPassword()">✗ Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        const PASSWORD = "BodaNyM";
        let accionPendiente = null;

        // Estructuras de datos
        let estado = {
            jugadores: [],
            parejas: [],
            partidos: []
        };

        // Cargar datos del localStorage
        function cargarDatos() {
            const datos = localStorage.getItem('tornePadel');
            if (datos) {
                estado = JSON.parse(datos);
            } else {
                // Pre-cargar jugadores iniciales
                estado.jugadores = [
                    { nombre: "Alvaro", genero: "H", id: 1 },
                    { nombre: "Virginia Jorge", genero: "M", id: 2 },
                    { nombre: "Félix", genero: "H", id: 3 },
                    { nombre: "José Manuel", genero: "H", id: 4 },
                    { nombre: "Iñaki", genero: "H", id: 5 },
                    { nombre: "Raúl Alicia", genero: "H", id: 6 },
                    { nombre: "Gabriel García", genero: "H", id: 7 },
                    { nombre: "Carlos Kitty", genero: "H", id: 8 },
                    { nombre: "Cristina Curita", genero: "M", id: 9 },
                    { nombre: "Kitty", genero: "M", id: 10 },
                    { nombre: "Luismi", genero: "H", id: 11 },
                    { nombre: "Raul", genero: "H", id: 12 },
                    { nombre: "Josete", genero: "H", id: 13 },
                    { nombre: "Dinamita", genero: "H", id: 14 },
                    { nombre: "Alicia Prima", genero: "M", id: 15 },
                    { nombre: "Mario", genero: "H", id: 16 },
                    { nombre: "Soto Nuevo", genero: "H", id: 17 },
                    { nombre: "Curita", genero: "H", id: 18 },
                    { nombre: "Alfonso Mora", genero: "H", id: 19 },
                    { nombre: "Cristian Jenny", genero: "H", id: 20 },
                    { nombre: "Javi Conejo", genero: "H", id: 21 },
                    { nombre: "Sevi", genero: "H", id: 22 },
                    { nombre: "Neke", genero: "H", id: 23 },
                    { nombre: "Jorge", genero: "H", id: 24 }
                ];
                guardarDatos();
            }
            actualizarUI();
        }

        // Guardar datos
        function guardarDatos() {
            localStorage.setItem('tornePadel', JSON.stringify(estado));
        }

        // Agregar jugador (con password)
        function agregarJugador() {
            const nombre = document.getElementById('nombreJugador').value.trim();
            const genero = document.getElementById('generoJugador').value;

            if (!nombre || !genero) {
                alert('Por favor completa nombre y género');
                return;
            }

            accionPendiente = { tipo: 'agregarJugador', nombre, genero };
            document.getElementById('passwordModal').classList.add('active');
            document.getElementById('passwordInput').focus();
            document.getElementById('passwordInput').value = '';
        }

        // Ejecutar agregar jugador después de password correcto
        function ejecutarAgregarJugador(nombre, genero) {
            estado.jugadores.push({ nombre, genero, id: Date.now() });
            document.getElementById('nombreJugador').value = '';
            document.getElementById('generoJugador').value = '';
            guardarDatos();
            actualizarUI();
        }

        // Eliminar jugador (con password)
        function eliminarJugador(id) {
            accionPendiente = { tipo: 'eliminarJugador', id };
            document.getElementById('passwordModal').classList.add('active');
            document.getElementById('passwordInput').focus();
            document.getElementById('passwordInput').value = '';
        }

        // Ejecutar eliminar jugador después de password correcto
        function ejecutarEliminarJugador(id) {
            estado.jugadores = estado.jugadores.filter(j => j.id !== id);
            guardarDatos();
            actualizarUI();
        }

        // Actualizar UI
        function actualizarUI() {
            actualizarListaJugadores();
            actualizarStats();
            actualizarParejas();
        }

        function actualizarStats() {
            const countH = estado.jugadores.filter(j => j.genero === 'H').length;
            const countM = estado.jugadores.filter(j => j.genero === 'M').length;
            document.getElementById('countH').textContent = countH;
            document.getElementById('countM').textContent = countM;
        }

        function actualizarListaJugadores() {
            const contenedor = document.getElementById('listaJugadores');
            if (estado.jugadores.length === 0) {
                contenedor.innerHTML = '<div class="empty-state">No hay jugadores aún</div>';
                return;
            }

            contenedor.innerHTML = estado.jugadores.map(j => `
                <div class="jugador-item">
                    <div>
                        <strong>${j.nombre}</strong>
                        <span class="genero-badge ${j.genero}">${j.genero === 'H' ? '👨 Hombre' : '👩 Mujer'}</span>
                    </div>
                    <button class="danger" onclick="eliminarJugador(${j.id})" style="width: 50px; padding: 5px;">✕</button>
                </div>
            `).join('');
        }

        // Generar parejas (con password)
        function solicitarPassword(accion) {
            if (accion === 'generarParejas' && estado.jugadores.length < 2) {
                alert('Necesitas al menos 2 jugadores para hacer parejas');
                return;
            }
            if (accion === 'generarEmparejamientos' && estado.parejas.length === 0) {
                alert('Necesitas parejas generadas primero');
                return;
            }

            accionPendiente = accion;
            document.getElementById('passwordModal').classList.add('active');
            document.getElementById('passwordInput').focus();
            document.getElementById('passwordInput').value = '';
        }

        function confirmarPassword() {
            const password = document.getElementById('passwordInput').value;
            if (password === PASSWORD) {
                if (typeof accionPendiente === 'string') {
                    // Acciones simples (string)
                    if (accionPendiente === 'generarParejas') {
                        generarParejas();
                    } else if (accionPendiente === 'generarEmparejamientos') {
                        generarEmparejamientos();
                    }
                } else if (typeof accionPendiente === 'object') {
                    // Acciones complejas (object)
                    if (accionPendiente.tipo === 'agregarJugador') {
                        ejecutarAgregarJugador(accionPendiente.nombre, accionPendiente.genero);
                    } else if (accionPendiente.tipo === 'eliminarJugador') {
                        ejecutarEliminarJugador(accionPendiente.id);
                    }
                }
                cancelarPassword();
            } else {
                alert('❌ Contraseña incorrecta');
                document.getElementById('passwordInput').value = '';
            }
        }

        function cancelarPassword() {
            document.getElementById('passwordModal').classList.remove('active');
            accionPendiente = null;
        }

        // Generar parejas aleatorias
        function generarParejas() {
            if (estado.jugadores.length < 2) {
                alert('Necesitas al menos 2 jugadores');
                return;
            }

            let jugadores = [...estado.jugadores].sort(() => Math.random() - 0.5);
            estado.parejas = [];

            // Algoritmo: intenta evitar dos mujeres juntas
            for (let i = 0; i < jugadores.length - 1; i += 2) {
                let j1 = jugadores[i];
                let j2 = jugadores[i + 1];

                // Si ambas son mujeres, intenta intercambiar
                if (j1.genero === 'M' && j2.genero === 'M' && i + 2 < jugadores.length) {
                    // Busca un hombre cercano para intercambiar
                    for (let k = i + 2; k < jugadores.length; k++) {
                        if (jugadores[k].genero === 'H') {
                            [j2, jugadores[k]] = [jugadores[k], j2];
                            break;
                        }
                    }
                }

                estado.parejas.push({
                    id: Date.now() + Math.random(),
                    jugadores: [j1, j2]
                });
            }

            // Si hay un jugador impar
            if (jugadores.length % 2 === 1) {
                estado.parejas.push({
                    id: Date.now() + Math.random(),
                    jugadores: [jugadores[jugadores.length - 1]]
                });
            }

            guardarDatos();
            actualizarParejas();
            alert('✅ Parejas generadas correctamente');
        }

        function actualizarParejas() {
            const contenedor = document.getElementById('parejas');
            if (estado.parejas.length === 0) {
                contenedor.innerHTML = '<div class="empty-state">Sin parejas todavía. Genera las parejas primero.</div>';
                return;
            }

            contenedor.innerHTML = estado.parejas.map((pareja, idx) => `
                <div class="pareja-card">
                    <h3>Pareja ${idx + 1}</h3>
                    <p>${pareja.jugadores.map(j => `${j.nombre} (${j.genero})`).join(' + ')}</p>
                </div>
            `).join('');
        }

        // Generar emparejamientos (partidos)
        function generarEmparejamientos() {
            if (estado.parejas.length < 2) {
                alert('Necesitas al menos 2 parejas');
                return;
            }

            let parejas = [...estado.parejas].sort(() => Math.random() - 0.5);
            estado.partidos = [];

            // Crear partidos (pareja vs pareja)
            for (let i = 0; i < parejas.length - 1; i += 2) {
                estado.partidos.push({
                    id: Date.now() + Math.random(),
                    pareja1: parejas[i],
                    pareja2: parejas[i + 1],
                    fase: 'grupos',
                    jornada: Math.floor(i / 2) + 1
                });
            }

            guardarDatos();
            mostrarPartidos();
            alert('✅ Emparejamientos generados correctamente');
        }

        function mostrarPartidos() {
            const contenedor = document.getElementById('contenedorPartidos');
            if (estado.partidos.length === 0) {
                contenedor.innerHTML = '<div class="empty-state">Los partidos aparecerán aquí una vez generes los emparejamientos.</div>';
                return;
            }

            const grupos = {};
            estado.partidos.forEach(partido => {
                if (!grupos[partido.jornada]) {
                    grupos[partido.jornada] = [];
                }
                grupos[partido.jornada].push(partido);
            });

            let html = '<div class="fase"><h3>⚽ Fase de Grupos</h3><div class="partidos-grid">';
            
            Object.keys(grupos).sort((a, b) => a - b).forEach(jornada => {
                html += grupos[jornada].map(partido => {
                    const nombres1 = partido.pareja1.jugadores.map(j => j.nombre).join(' + ');
                    const nombres2 = partido.pareja2.jugadores.map(j => j.nombre).join(' + ');
                    return `
                        <div class="partido-card">
                            <h4>Jornada ${jornada}</h4>
                            <div>${nombres1}</div>
                            <div class="vs">VS</div>
                            <div>${nombres2}</div>
                        </div>
                    `;
                }).join('');
            });

            html += '</div></div>';
            contenedor.innerHTML = html;
        }

        function limpiarTodo() {
            if (confirm('¿Estás seguro de que quieres limpiar todo?')) {
                estado = {
                    jugadores: [],
                    parejas: [],
                    partidos: []
                };
                guardarDatos();
                actualizarUI();
                document.getElementById('contenedorPartidos').innerHTML = '<div class="empty-state">Los partidos aparecerán aquí una vez generes los emparejamientos.</div>';
            }
        }

        // Cargar datos al iniciar
        cargarDatos();
    </script>
</body>
</html>
